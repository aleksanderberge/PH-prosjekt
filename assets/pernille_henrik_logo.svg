<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900">
  <title>Pernille &amp; Henrik – logo</title>
  <desc>Transparent vector logo in warm gold.</desc>

  <defs>
    <style>
      .gold { fill:#D6B06A; stroke:#D6B06A; }
      .serif { font-family: "Cormorant Garamond", "Baskerville", "Times New Roman", serif; }
      .sans { font-family: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .script { font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive; }
    </style>
  </defs>

  <!-- Monogram ring -->
  <path d="M655 245 C690 130 785 88 875 105"
        fill="none" stroke="#D6B06A" stroke-width="5" stroke-linecap="round"/>
  <path d="M945 135 C1010 180 1035 280 998 360"
        fill="none" stroke="#D6B06A" stroke-width="5" stroke-linecap="round"/>

  <!-- Chef hat -->
  <g transform="translate(775,38)" fill="none" stroke="#D6B06A" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 70
             C20 68 8 54 10 37
             C12 21 26 12 40 15
             C45 1 58 -6 71 1
             C83 -7 101 -1 105 15
             C121 11 136 22 138 38
             C140 54 128 68 110 70"/>
    <path d="M42 70 L106 70 L101 101 L47 101 Z"/>
    <path d="M53 84 L96 84"/>
  </g>

  <!-- Monogram -->
  <text x="800" y="310" text-anchor="middle"
        class="serif" font-size="190" fill="#D6B06A">P&amp;H</text>

  <!-- Decorative branches -->
  <g fill="none" stroke="#D6B06A" stroke-width="4" stroke-linecap="round">
    <path d="M320 325 C400 350 470 345 555 300"/>
    <path d="M1280 325 C1200 350 1130 345 1045 300"/>
  </g>

  <g fill="none" stroke="#D6B06A" stroke-width="3">
    <!-- left leaves -->
    <path d="M365 335 l-28 -24"/>
    <path d="M395 340 l-20 -31"/>
    <path d="M430 339 l-9 -34"/>
    <path d="M467 329 l9 -34"/>
    <path d="M500 315 l19 -29"/>
    <ellipse cx="333" cy="307" rx="10" ry="19" transform="rotate(-50 333 307)"/>
    <ellipse cx="376" cy="304" rx="10" ry="19" transform="rotate(-30 376 304)"/>
    <ellipse cx="421" cy="300" rx="10" ry="19" transform="rotate(-10 421 300)"/>
    <ellipse cx="478" cy="292" rx="10" ry="19" transform="rotate(20 478 292)"/>
    <ellipse cx="523" cy="277" rx="10" ry="19" transform="rotate(38 523 277)"/>

    <!-- right leaves -->
    <path d="M1235 335 l28 -24"/>
    <path d="M1205 340 l20 -31"/>
    <path d="M1170 339 l9 -34"/>
    <path d="M1133 329 l-9 -34"/>
    <path d="M1100 315 l-19 -29"/>
    <ellipse cx="1267" cy="307" rx="10" ry="19" transform="rotate(50 1267 307)"/>
    <ellipse cx="1224" cy="304" rx="10" ry="19" transform="rotate(30 1224 304)"/>
    <ellipse cx="1179" cy="300" rx="10" ry="19" transform="rotate(10 1179 300)"/>
    <ellipse cx="1122" cy="292" rx="10" ry="19" transform="rotate(-20 1122 292)"/>
    <ellipse cx="1077" cy="277" rx="10" ry="19" transform="rotate(-38 1077 277)"/>
  </g>

  <!-- Restaurant name -->
  <text x="800" y="520" text-anchor="middle"
        class="serif" font-size="94" letter-spacing="3"
        fill="#D6B06A">PERNILLE &amp; HENRIK</text>

  <!-- Subtitle -->
  <line x1="250" y1="602" x2="430" y2="602" stroke="#D6B06A" stroke-width="3"/>
  <line x1="1170" y1="602" x2="1350" y2="602" stroke="#D6B06A" stroke-width="3"/>
  <text x="800" y="622" text-anchor="middle"
        class="sans" font-size="44" font-weight="600" letter-spacing="9"
        fill="#D6B06A">KJØKKEN &amp; KJÆRLIGHET</text>

  <!-- Tagline -->
  <text x="800" y="715" text-anchor="middle"
        class="script" font-size="51" fill="#D6B06A">
    Laget med lidenskap – servert med stolthet
  </text>

  <!-- Heart -->
  <path d="M800 804
           C772 774 724 783 724 821
           C724 856 760 879 800 910
           C840 879 876 856 876 821
           C876 783 828 774 800 804 Z"
        transform="translate(0,-42) scale(.42) translate(1105,1115)"
        fill="none" stroke="#D6B06A" stroke-width="9"/>
</svg>
